<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Adnova AI</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
  <link rel="stylesheet" href="/vendor/katex/katex.min.css">
<link rel="stylesheet" href="/vendor/markdown-it-texmath/texmath.css">
</head>

<body>

<div
  id="connection-status"
  class="connection-status"
  aria-live="polite"
>
  Connected
</div>

<button
  id="new-chat-button"
  class="new-chat-button"
  type="button"
  aria-label="Start a new chat"
>
  New chat
</button>
  <main class="app">

    <section class="welcome" id="welcome">
      <div class="logo">
        <div class="logo-mark">A</div>
      </div>

      <h1>How can I help?</h1>

      <p>
        Ask Adnova anything — code, ideas, questions, research and more.
      </p>
    </section>

    <section class="messages" id="messages"></section>

    <div class="composer-area">
      <form class="composer" id="chat-form">

        <textarea
          id="message-input"
          rows="1"
          maxlength="20000"
          placeholder="Message Adnova..."
          autocomplete="off"
          spellcheck="true"
        ></textarea>

        <button
          class="send-button"
          id="send-button"
          type="submit"
          aria-label="Send message"
        >
          <svg
            viewBox="0 0 24 24"
            width="20"
            height="20"
            fill="none"
            stroke="currentColor"
            stroke-width="2.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 19V5"></path>
            <path d="M6 11l6-6 6 6"></path>
          </svg>
        </button>

      </form>

      <div class="composer-hint">
        Adnova can make mistakes. Check important information.
      </div>
    </div>

  </main>

  <button
  id="scroll-bottom-button"
  class="scroll-bottom-button"
  type="button"
  aria-label="Scroll to bottom"
>
  <svg viewBox="0 0 20 20" aria-hidden="true">
    <path
      d="M10 4V16M5 11L10 16L15 11"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </svg>
</button>

<script src="/vendor/katex/katex.min.js"></script>
<script src="/vendor/markdown-it/markdown-it.umd.min.js"></script>
<script src="/vendor/markdown-it-texmath/texmath.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
